name: Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build, links, accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Production build
        run: pnpm build

      - name: Internal links, anchors, and output contents
        run: pnpm check:dist

      - name: Install Chromium for the accessibility scan
        run: pnpm exec playwright install --with-deps chromium

      - name: Accessibility scan of built pages
        run: pnpm check:a11y
